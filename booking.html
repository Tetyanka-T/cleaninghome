<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ameliva Home Cleaning | Professional Cleaning Services in Chicago</title>
    <meta name="description"
        content="Professional residential and commercial cleaning services in Chicago & surrounding suburbs. Standard, deep, move-in/out, and Airbnb turnovers.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC541e3CH1XJ8A25154/zAW6f17489re6e2EB1bApQ+pjOHra68bfE3280+ZwLnVoA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./sass/main.css">
    </link>
</head>

<body>
    <section id="booking-form" class="section__booking">
        <div class="container">
            <h2 class="section__title">Get Your Free Quote</h2>
            <p class="section__subtitle">Tell us about your home and choose your preferred schedule.</p>

            <form class="section__booking__form" action="#" method="POST">

                <div class="section__booking__form__group-row">
                    <div class="section__booking__form__field">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                    </div>
                    <div class="section__booking__form__field">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" placeholder="(773) 000-0000" required>
                    </div>
                    <div class="section__booking__form__field">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                </div>


                <div class="section__booking__form__group-row">
                    <div class="section__booking__form__field">
                        <label for="city">City / Area *</label>
                        <input type="text" id="city" name="city" placeholder="Chicago" required>
                    </div>
                    <div class="section__booking__form__field">
                        <label for="zipCode">ZIP Code *</label>
                        <input type="text" id="zipCode" name="zipCode" placeholder="60614" required>
                    </div>
                    <div class="section__booking__form__field">
                        <label for="serviceType">Type of Cleaning *</label>
                        <select id="serviceType" name="serviceType" required>
                            <option value="regular">Regular Cleaning</option>
                            <option value="deep">Deep Cleaning</option>
                            <option value="move-in-out">Move-In / Move-Out</option>
                            <option value="airbnb">Airbnb Turnover</option>
                            <option value="office">Office Cleaning</option>
                        </select>
                    </div>
                </div>

                <div class="section__booking__form__group-row">
                    <div class="section__booking__form__field">
                        <label for="bedrooms">Bedrooms</label>
                        <select id="bedrooms" name="bedrooms">
                            <option value="studio">Studio</option>
                            <option value="1">1 Bedroom</option>
                            <option value="2">2 Bedrooms</option>
                            <option value="3">3 Bedrooms</option>
                            <option value="4+">4+ Bedrooms</option>
                        </select>
                    </div>
                    <div class="section__booking__form__field">
                        <label for="bathrooms">Bathrooms</label>
                        <select id="bathrooms" name="bathrooms">
                            <option value="1">1 Bathroom</option>
                            <option value="1.5">1.5 Bathrooms</option>
                            <option value="2">2 Bathrooms</option>
                            <option value="3+">3+ Bathrooms</option>
                        </select>
                    </div>
                    <div class="section__booking__form__field">
                        <label for="frequency">Cleaning Frequency</label>
                        <select id="frequency" name="frequency">
                            <option value="one-time">One-Time Cleaning</option>
                            <option value="weekly">Weekly (15% OFF)</option>
                            <option value="bi-weekly">Every 2 Weeks (10% OFF)</option>
                            <option value="monthly">Monthly (5% OFF)</option>
                        </select>
                    </div>
                </div>


                <div class="section__booking__form__field full-width">
                    <label for="notes">Additional Notes / Specific Requests</label>
                    <textarea id="notes" name="notes" rows="3"
                        placeholder="Tell us anything we should know about your home or specific needs..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-submit">Request Free Quote</button>
            </form>
        </div>
    </section>

</body>

</html>
